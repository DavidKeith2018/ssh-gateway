name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Tags must use vMAJOR.MINOR.PATCH'; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: windows-2022
            arch: amd64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      GATEWAY_VERSION: ${{ needs.version.outputs.version }}
      GATEWAY_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm run build:desktop
        working-directory: web
      - run: go test ./... -timeout=10m
      - run: go vet ./...
      - run: go -C desktop test -tags server ./...
        env:
          CGO_ENABLED: '0'
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p dist
          go -C desktop build -tags 'desktop,production,gtk3' -trimpath -ldflags "-X ssh-gateway/updater.Version=$GATEWAY_VERSION -X ssh-gateway/updater.Repository=$GATEWAY_RELEASE_REPOSITORY" -o ../dist/ssh-gateway-desktop .
          bash packaging/linux/build.sh
          bash packaging/server/build.sh
          GATEWAY_ARCH=arm64 bash packaging/server/build.sh
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web test -- --max-failures=1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          $desktopBinary = Join-Path $env:GITHUB_WORKSPACE "dist/ssh-gateway-desktop-windows.exe"
          go -C desktop run ./tools/winres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C desktop build -tags 'desktop,production' -trimpath -ldflags "-H windowsgui -X ssh-gateway/updater.Version=$env:GATEWAY_VERSION -X ssh-gateway/updater.Repository=$env:GATEWAY_RELEASE_REPOSITORY" -o "$desktopBinary" .
          if (-not (Test-Path -LiteralPath $desktopBinary -PathType Leaf)) { throw "Windows binary was not generated" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature packaging/windows/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 bootstrapper signature' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 "/DVERSION=$env:GATEWAY_VERSION" "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-setup.exe" | Select-Object -First 1
          ./packaging/windows/test-installer.ps1 -InstallerPath $installer.FullName
          $portableVersion = $env:GATEWAY_VERSION
          Compress-Archive -LiteralPath $desktopBinary, packaging/windows/PORTABLE.txt, packaging/windows/MicrosoftEdgeWebview2Setup.exe -DestinationPath "dist/ssh-gateway-desktop-$portableVersion-windows-x64-portable.zip"
      - if: runner.os == 'macOS'
        run: bash packaging/macos/build.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*-setup.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        working-directory: release
        run: |
          for file in \
            "ssh-gateway-desktop_${RELEASE_VERSION}_amd64.deb" \
            "ssh-gateway-desktop-${RELEASE_VERSION}-windows-x64-setup.exe" \
            "ssh-gateway-desktop-${RELEASE_VERSION}-windows-x64-portable.zip" \
            "ssh-gateway-desktop-${RELEASE_VERSION}-macos-arm64.dmg" \
            "ssh-gateway-desktop-${RELEASE_VERSION}-macos-amd64.dmg" \
            "ssh-gateway-server_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "ssh-gateway-server_${RELEASE_VERSION}_linux_arm64.tar.gz"; do
            test -s "$file"
          done
          unzip -t "ssh-gateway-desktop-${RELEASE_VERSION}-windows-x64-portable.zip"
          # Stable names support website download links; retain versioned packages as well.
          cp "ssh-gateway-server_${RELEASE_VERSION}_linux_amd64.tar.gz" ssh-gateway-server-linux-amd64.tar.gz
          cp "ssh-gateway-server_${RELEASE_VERSION}_linux_arm64.tar.gz" ssh-gateway-server-linux-arm64.tar.gz
          cp "ssh-gateway-desktop_${RELEASE_VERSION}_amd64.deb" ssh-gateway-desktop-linux-amd64.deb
          cp "ssh-gateway-desktop-${RELEASE_VERSION}-windows-x64-setup.exe" ssh-gateway-desktop-windows-x64-setup.exe
          cp "ssh-gateway-desktop-${RELEASE_VERSION}-windows-x64-portable.zip" ssh-gateway-desktop-windows-x64-portable.zip
          cp "ssh-gateway-desktop-${RELEASE_VERSION}-macos-arm64.dmg" ssh-gateway-desktop-macos-arm64.dmg
          cp "ssh-gateway-desktop-${RELEASE_VERSION}-macos-amd64.dmg" ssh-gateway-desktop-macos-amd64.dmg
          sha256sum -- *.deb *.exe *.dmg *.zip *.tar.gz > checksums.txt
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > existing-draft; then
            test "$(cat existing-draft)" = true || { echo 'Release already exists; use a new version instead of overwriting it'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber -- *.deb *.exe *.dmg *.zip *.tar.gz checksums.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
