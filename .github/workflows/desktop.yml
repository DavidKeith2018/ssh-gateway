name: Desktop build and verification
on:
  workflow_dispatch:
  push:
    paths: ['**.go', '**/go.mod', '**/go.sum', 'web/**', 'desktop/**', 'packaging/**', '.github/workflows/desktop.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04
            arch: amd64
          - os: windows-2022
            arch: amd64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm run build:desktop
        working-directory: web
      - run: go test -race ./... -timeout=10m
      - run: go vet ./...
      - run: go -C desktop test -tags server ./...
        env:
          CGO_ENABLED: "0"
      - run: go -C desktop vet -tags server ./...
        env:
          CGO_ENABLED: "0"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
          mkdir -p dist
          go -C desktop build -tags 'desktop,production,gtk3' -o ../dist/ssh-gateway-desktop .
          bash packaging/linux/build.sh
          go -C desktop test -race -tags gtk3 ./...
          go -C desktop build -race -tags 'production,gtk3,native_smoke' -o ../.build-native-smoke .
          timeout 90s xvfb-run -a dbus-run-session -- ./.build-native-smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          $desktopBinary = Join-Path $env:GITHUB_WORKSPACE "dist/ssh-gateway-desktop-windows.exe"
          go -C desktop run ./tools/winres
          go -C desktop build -tags 'desktop,production' -ldflags '-H windowsgui' -o "$desktopBinary" .
          if (-not (Test-Path -LiteralPath $desktopBinary -PathType Leaf)) { throw "Windows binary was not generated" }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature packaging/windows/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 bootstrapper signature' }
          choco install nsis -y --no-progress
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-setup.exe" | Select-Object -First 1
          ./packaging/windows/test-installer.ps1 -InstallerPath $installer.FullName
          $portableVersion = 'test'
          Compress-Archive -LiteralPath $desktopBinary, packaging/windows/PORTABLE.txt, packaging/windows/MicrosoftEdgeWebview2Setup.exe -DestinationPath "dist/ssh-gateway-desktop-$portableVersion-windows-x64-portable.zip"
      - if: runner.os == 'macOS'
        run: bash packaging/macos/build.sh '${{ matrix.arch }}'
      - if: matrix.os == 'ubuntu-24.04'
        name: Web and desktop bridge regression
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}-test-build
          path: dist/*
